# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "djomy-api"
handle = "djomy-mobile-money"
embedded = true
client_id = "7f5ed09da3fb12b0b2b2fe38eddc04e1"
application_url = "https://djomy.ousmanebellasarl.com"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_orders,read_orders"

[auth]
redirect_urls = [
  "https://djomy.ousmanebellasarl.com/auth/callback",
  "https://djomy.ousmanebellasarl.com/auth/shopify/callback",
  "https://djomy.ousmanebellasarl.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [
  "app/uninstalled",
  "orders/create",
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
