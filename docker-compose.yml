# Déploiement sur un VPS : app Remix + PostgreSQL.
#
# L'app n'écoute que sur 127.0.0.1 : c'est le proxy HTTPS déjà en place sur
# le serveur qui l'expose sur le sous-domaine.
#
# Le fichier `.env` du serveur (jamais versionné) fournit les secrets de
# l'app ainsi que POSTGRES_PASSWORD (openssl rand -hex 24) et, au besoin,
# APP_PORT.

name: djomy-shopify

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: djomy
      POSTGRES_DB: djomy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - djomy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djomy -d djomy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Ces valeurs priment sur celles du .env.
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://djomy:${POSTGRES_PASSWORD}@db:5432/djomy
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"

volumes:
  djomy-db:
